name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when the same branch or PR is pushed to again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository. Anything needing more should ask for
# it on the job that needs it, not here.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Single source of truth: the same file nvm reads locally.
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` — not `npm install` — so the lockfile is honoured exactly and a
      # drifted lockfile fails the build instead of being silently rewritten.
      - name: Install dependencies
        run: npm ci

      # Each check is its own step so a red run says which gate failed without
      # anyone opening the log. They are not combined into `npm run check`.
      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # The generated files: the plates built from their landmarks,
      # references/SOURCES.md built from src/data/references/sources.ts, and
      # robots.txt and sitemap.xml built from src/data/site.ts and the data.
      # All three compare bytes, and all three catch the same mistake — a
      # generated file edited by hand, after which the source of truth is
      # fiction. `npm run check` runs them locally; nothing ran them here until
      # the credits list started being rendered from the same records as
      # SOURCES.md.
      #
      # The sitemap is the one where it matters most, because it is the only
      # generated file on the site that no human ever opens: a specimen missing
      # from it is invisible, and nothing looks broken.
      - name: Verify generated files
        run: npm run plate:verify && npm run sources:verify && npm run seo:verify

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
