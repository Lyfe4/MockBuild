<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Content-Security-Policy — FALLBACK COPY.

      The authoritative policy is the response header in `public/_headers`,
      which Netlify serves. This tag is the same policy minus one directive, and
      exists only to cover the case where `dist/` is served by something that
      ignores that file: `vite preview`, a plain static server, or a host other
      than Netlify. **Change one and change the other.**

      `frame-ancestors` is deliberately absent here rather than merely
      redundant. Browsers ignore it in a <meta> tag and log an error saying so,
      and an ignored directive in the markup reads like clickjacking protection
      that is not actually there. It lives in the header, where it works.

      The rest is deliberately strict:
        · script-src 'self'   no inline scripts, no eval, no third-party JS.
        · style-src  'self'   CSS Modules compile to an external stylesheet and
                              the illustrations use SVG presentation attributes,
                              so no inline <style> or style="" is needed.
        · connect-src 'self'  the archive is fully static; nothing phones home.

      For this to hold at build time, `build.modulePreload.polyfill` is disabled
      in vite.config.ts — the polyfill would otherwise inject an inline <script>.

      The dev server cannot satisfy this policy: Vite injects an inline React
      Fast Refresh preamble, serves CSS as inline <style> before extraction, and
      opens a WebSocket for HMR. Rather than weaken the shipped policy to suit
      `vite dev`, the `thornfield:relax-csp-for-dev` plugin in vite.config.ts
      rewrites this tag's content on the dev server only. `vite build` output is
      untouched — what you see below is what users get.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Thornfield Entomological Archive</title>
    <meta
      name="description"
      content="A working entomological collection. Thornfield holds pinned specimens and accession records for real insect species, each illustrated by a hand-authored plate traced from a public-domain reference."
    />

    <!-- Neutral archival paper; matches --color-bg before a season is applied. -->
    <meta name="theme-color" content="#f5f1e8" />
    <meta name="color-scheme" content="light" />

    <!--
      Open Graph, and the **site-level defaults**.
      
      These describe the home page and are what a scraper that runs no
      JavaScript sees on every URL. `src/features/meta/useRouteMeta.ts` rewrites
      the title, description, canonical, og:title, og:description, og:url and
      og:type as each route mounts — in place, by selector, rather than by
      appending, so there is never a second copy of any of them for a consumer
      to read first.
      
      The origin below is repeated from `src/data/site.ts`, which is the single
      source of truth for it and the only place to change it. It cannot be
      injected into this file without a build plugin, and a build plugin that
      rewrote the head would be a second mechanism doing what the first one
      already does everywhere else. `src/test/securityHeaders.test.ts` asserts
      the two agree.
      
      It used to say `example.com`, behind a comment asking whoever deployed the
      site to remember. Nobody failed a build for forgetting.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Thornfield Entomological Archive" />
    <meta property="og:title" content="Thornfield Entomological Archive" />
    <meta
      property="og:description"
      content="A working entomological collection. Pinned specimens, accession records and hand-authored plates of real insect species."
    />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:url" content="https://thornfield-archive.netlify.app/" />
    <meta property="og:image" content="https://thornfield-archive.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="An engraved plate of a male stag beetle in dorsal view beside the wordmark of the Thornfield Entomological Archive, on archival paper."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Preload the three faces the first paint actually needs: Fraunces roman,
      Fraunces italic and the mono. All are self-hosted, so `crossorigin` is
      still required — fonts are fetched in CORS mode regardless of origin, and
      without it the browser downloads the file twice.

      The italic was deliberately left out of this list, on the grounds that it
      was needed only for "text that is below the fold". That was wrong, and
      Lighthouse said so: **every scientific name on the site is italic**,
      including the binomial on the first row of the catalogue, so the italic is
      wanted at the very top of the first screen. Left undeclared it was
      discovered by the stylesheet instead, which made it a *chained* request —
      HTML, then CSS, then a 154 kB font — and the longest critical chain on the
      site by a wide margin. Preloaded, it downloads in parallel with the
      stylesheet that asks for it.

      The Latin-extended subsets stay out, and that reasoning does hold: their
      `unicode-range` declarations mean a browser fetches them only if a name
      needs a glyph from those blocks, and no name in the collection does.
    -->
    <link
      rel="preload"
      href="/fonts/fraunces-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/fraunces-italic-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="canonical" href="https://thornfield-archive.netlify.app/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      The Thornfield catalogue needs JavaScript to browse the collection. The accession records
      themselves are available on request from the archive.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
